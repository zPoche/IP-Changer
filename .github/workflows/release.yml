# Bei Push eines Version-Tags (v*) bauen und ZIP mit der portable self-contained EXE am GitHub-Release anhängen.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (Single-File, self-contained win-x64)
        run: dotnet publish IP-Changer/IP-Changer.csproj -c Release -r win-x64 -o "${{ github.workspace }}/publish-out"

      - name: ZIP (nur EXE)
        id: pack
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "ProfileIpSwitcher-$tag-win-x64-self-contained.zip"
          Compress-Archive -LiteralPath "publish-out/ProfileIpSwitcher.exe" -DestinationPath $zip -Force
          Add-Content -Path $env:GITHUB_OUTPUT -Value "asset=$zip"

      - name: Release erstellen / Assets anhängen
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.asset }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
